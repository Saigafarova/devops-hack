apiVersion: v1
kind: ConfigMap
metadata:
  name: filebeat-config
  namespace: default
data: 
  filebeat.yml: |
    filebeat.inputs:
    - type: container
      paths:
        - /var/log/containers/nginx*.log
      processors:
        - add_kubernetes_metadata:
            host: ${NODE_NAME}
            matchers:
            - logs_path:
                logs_path: "/var/log/containers/"
    output.console:
      pretty: true